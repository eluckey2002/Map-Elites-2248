# The experiment gate is a script (tools/verify-experiments.js) that nobody was
# required to run. On 2026-09-03 a pull request admitted RESULT-0027 to the
# ledger with the gate red and merged ten minutes later; the check had fired,
# nothing was listening. This workflow is the listener.
#
# Job 1 is the gate and is meant to be a required status check on main.
# Job 2 is the full test suite, reported but not blocking, because main
# carries three known failures (two deliberately visible receipt mismatches
# and one generated-view staleness check) that are
# tracked elsewhere and must not mask a red gate.
# Job 3 runs the tests of tools/freshness (BL-0022). The gate above does not run
# them, so without this job nothing exercised that code in CI. It is a separate
# job so a failure is visible on the pull request; making it a required check is a
# branch-protection setting, not something this file can do.
name: experiment-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  experiment-gate:
    name: experiment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate reads registration commits and ancestry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: EXPERIMENT GATE
        env:
          # On a push to main, compare the ledger with the commit before the push.
          LEDGER_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node tools/verify-experiments.js
      - name: LEDGER AUTHORSHIP GATE
        run: node tools/verify-ledger-authorship.js
      - name: LEDGER INDEX CURRENT
        run: node tools/ledger-index.js --check
      - name: NO MERGE-CONFLICT MARKERS
        # On 2026-09-26 a PR reached "ready" with <<<<<<< markers committed in AGENTS.md.
        # git grep exits 0 on a match, 1 on none, 128 on error: only 1 passes.
        run: |
          rc=0; git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' || rc=$?
          [ "$rc" -eq 1 ] || { echo "conflict markers found or git grep failed (exit $rc)"; exit 1; }

  test-suite:
    name: full test suite (informational until the three known failures are retired)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test
        run: node --test solver/tests/*.test.js

  freshness-tools:
    name: freshness tools tests (BL-0022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test (tools/freshness)
        run: node --test solver/tests/freshnessCheck.test.js solver/tests/worktreeSweep.test.js solver/tests/freshnessRollout.test.js solver/tests/freshnessInstall.test.js
