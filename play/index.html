<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeded 2048 — playtest</title>
<style>
  :root {
    --bg: #14140f; --panel: #1e1e18; --line: #33332a;
    --ink: #efeade; --dim: #9a9484; --wall: #45403a;
    --accent: #d8a657; --good: #89b482;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--dim); font-size: 13px; margin: -12px 0 0; }

  .levels { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .levels button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 13px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: .12s;
  }
  .levels button:hover { color: var(--ink); border-color: var(--accent); }
  .levels button.on { background: var(--accent); color: #1a1a12; border-color: var(--accent); font-weight: 600; }

  .stats { display: flex; gap: 26px; font-variant-numeric: tabular-nums; }
  .stat { text-align: center; }
  .stat .v { font-size: 22px; font-weight: 600; }
  .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }

  #grid {
    display: grid; gap: 9px; background: var(--panel);
    padding: 9px; border-radius: 11px; border: 1px solid var(--line);
    touch-action: none;
  }
  .cell {
    width: 74px; height: 74px; border-radius: 8px; background: #26261e;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums;
    transition: background .09s, color .09s;
  }
  .cell.wall { background: var(--wall); }
  .cell.wall::after { content: '×'; color: #6a6358; font-size: 20px; }
  .t2    { background: #3d3a2e; color: var(--ink); }
  .t4    { background: #4a4433; color: var(--ink); }
  .t8    { background: #7a5a32; color: #fff8ec; }
  .t16   { background: #9c6b2f; color: #fff8ec; }
  .t32   { background: #b8742a; color: #fff8ec; }
  .t64   { background: #c8562a; color: #fff8ec; }
  .t128  { background: #cf3f3f; color: #fff8ec; font-size: 22px; }
  .t256, .t512, .t1024, .t2048 { background: var(--accent); color: #1a1a12; font-size: 21px; }

  #msg {
    min-height: 62px; max-width: 430px; text-align: center;
    padding: 11px 15px; border-radius: 9px; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  #msg.win  { background: #24301f; color: var(--good); border: 1px solid #3c5233; }
  #msg.lose { background: #301f1f; color: #d68b8b; border: 1px solid #523333; }
  #msg.idle { color: var(--dim); }

  .hint { color: var(--dim); font-size: 12.5px; text-align: center; max-width: 430px; }
  kbd {
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 11.5px; font-family: inherit;
  }
  button.again {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button.again:hover { color: var(--ink); border-color: var(--accent); }
</style>
</head>
<body>

<h1>Seeded 2048 — playtest</h1>
<p class="sub">Same board every time. Build the target tile before you run out of moves.</p>

<div class="levels" id="levels"></div>

<div class="stats">
  <div class="stat"><div class="v" id="statTarget">—</div><div class="k">target</div></div>
  <div class="stat"><div class="v" id="statMoves">—</div><div class="k">moves left</div></div>
  <div class="stat"><div class="v" id="statBest">—</div><div class="k">best tile</div></div>
</div>

<div id="grid"></div>

<div id="msg" class="idle">Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to slide.</div>

<button class="again" id="again">restart level</button>

<p class="hint">
  The optimal move count is hidden while you play, so it can't nudge you.
  It's revealed when the level ends.
</p>

<script type="module">
import { createLevel, maxTile, legalMoves, step, rngSeed } from '/engine.js';

const levels = await (await fetch('/play/levels.json')).json();

const grid = document.getElementById('grid');
const msg = document.getElementById('msg');
const levelBar = document.getElementById('levels');

let cur = null;   // the level definition
let lv = null;    // live board
let rngState = 0;
let movesUsed = 0;
let over = false;

function load(i) {
  cur = levels[i];
  lv = createLevel({ w: 4, h: 4, cells: cur.cells, target: cur.target, budget: cur.budget });
  rngState = rngSeed(cur.seed);
  movesUsed = 0;
  over = false;

  grid.style.gridTemplateColumns = `repeat(4, 74px)`;
  [...levelBar.children].forEach((b, n) => b.classList.toggle('on', n === i));
  say('idle', 'Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to slide.');
  render();
}

function say(kind, html) {
  msg.className = kind;
  msg.innerHTML = html;
}

function render() {
  grid.innerHTML = '';
  for (const v of lv.cells) {
    const d = document.createElement('div');
    d.className = 'cell' + (v === -1 ? ' wall' : v > 0 ? ` t${v}` : '');
    d.textContent = v > 0 ? v : '';
    grid.appendChild(d);
  }
  document.getElementById('statTarget').textContent = lv.target;
  document.getElementById('statMoves').textContent = Math.max(0, lv.budget - movesUsed);
  document.getElementById('statBest').textContent = maxTile(lv) || '—';
}

function finish(won) {
  over = true;
  const opt = cur.optimalMoves;
  if (won) {
    const delta = movesUsed - opt;
    const verdict = delta === 0
      ? `<b>Exactly optimal.</b> Nobody can do it faster.`
      : `<b>${delta} move${delta === 1 ? '' : 's'} above optimal</b> (${opt} is provably the fastest).`;
    say('win', `Solved in ${movesUsed}. ${verdict}`);
  } else {
    say('lose', `Out of road at ${movesUsed} moves. This level is provably winnable in <b>${opt}</b>, with ${cur.slack} to spare.`);
  }
  render();
}

function play(dir) {
  if (over) return;
  const res = step(lv, dir, rngState);
  if (!res.moved) return;

  lv.cells = res.cells;
  rngState = res.rngState;
  movesUsed++;

  if (maxTile(lv) >= lv.target) return finish(true);
  if (movesUsed >= lv.budget || legalMoves(lv).length === 0) return finish(false);
  render();
}

const KEYS = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  a: 'left', d: 'right', w: 'up', s: 'down',
};
addEventListener('keydown', (e) => {
  const dir = KEYS[e.key];
  if (!dir) return;
  e.preventDefault();
  play(dir);
});

levels.forEach((l, i) => {
  const b = document.createElement('button');
  b.textContent = l.band;
  b.onclick = () => load(i);
  levelBar.appendChild(b);
});
document.getElementById('again').onclick = () => load(levels.indexOf(cur));

load(0);
</script>
</body>
</html>
